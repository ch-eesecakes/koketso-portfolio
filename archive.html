<section class="archive section-pad" id="archive" aria-labelledby="archive-heading"><div class="section-heading"><h2 class="eyebrow" id="archive-heading">Archive</h2><p>Earlier work</p></div><div class="archive-grid"><figure class="archive-card"><button type="button" class="archive-image archive-view" data-archive="1" aria-label="View Faces Between the Lines"><img src="assets/photos/archive-1-7d2223b228.jpg" alt="Faces Between the Lines by Koketso Masemola" width="1500" height="2000" loading="lazy"><span class="archive-expand" aria-hidden="true">↗</span></button><figcaption><h3>Faces Between the Lines</h3><div class="archive-description"><p class="archive-credit">Koketso Masemola · 2023</p><p class="archive-medium"><strong>Medium:</strong> Mixed media: paint and black wool on paper</p><p class="archive-prose">This artwork combines three painted colours with faces formed from black wool. The flowing lines create overlapping facial forms, exploring portraiture through shape, texture and the relationship between line and colour.</p></div></figcaption></figure>
<figure class="archive-card"><button type="button" class="archive-image archive-view" data-archive="2" aria-label="View Distorted Identity"><img src="assets/photos/archive-2-b1bbe4cd1b.jpg" alt="Distorted Identity by Koketso Masemola" width="994" height="2000" loading="lazy"><span class="archive-expand" aria-hidden="true">↗</span></button><figcaption><h3>Distorted Identity</h3><div class="archive-description"><p class="archive-credit">Koketso Masemola · 2023</p><p class="archive-medium"><strong>Medium:</strong> Stippling using pen and markers on paper (two-part artwork)</p><p class="archive-prose"><em>Distorted Identity</em> consists of two facial drawings created using stippling, with one presented against a white background and the other against black. The contrasting backgrounds highlight the distorted facial features differently, exploring how colour, form and visual contrast can influence the way a face is perceived. Together, the drawings experiment with portraiture and challenge conventional representations of facial identity.</p></div></figcaption></figure>
<figure class="archive-card"><button type="button" class="archive-image archive-view" data-archive="3" aria-label="View Side by Side"><img src="assets/photos/archive-3-8e25b684c5.jpg" alt="Side by Side by Koketso Masemola" width="2000" height="1430" loading="lazy"><span class="archive-expand" aria-hidden="true">↗</span></button><figcaption><h3>Side by Side</h3><div class="archive-description"><p class="archive-credit">Koketso Masemola · 2023</p><p class="archive-medium"><strong>Medium:</strong> Acrylic on paper</p><p class="archive-prose">A painting of two penguins surrounded by rocks. The artwork explores animal forms and the relationship between living subjects and their natural surroundings.</p></div></figcaption></figure>
<figure class="archive-card"><button type="button" class="archive-image archive-view" data-archive="4" aria-label="View Where the Sun Meets the Sea"><img src="assets/photos/archive-4-4f75095820.jpg" alt="Where the Sun Meets the Sea by Koketso Masemola" width="2000" height="1468" loading="lazy"><span class="archive-expand" aria-hidden="true">↗</span></button><figcaption><h3>Where the Sun Meets the Sea</h3><div class="archive-description"><p class="archive-credit">Koketso Masemola · 2023</p><p class="archive-medium"><strong>Medium:</strong> Acrylic on watercolour paper</p><p class="archive-prose">A sunset landscape combining ocean, trees and warm tones of orange, red and yellow. The painting explores the beauty of natural scenery through colour and atmosphere.</p></div></figcaption></figure>
<figure class="archive-card"><button type="button" class="archive-image archive-view" data-archive="5" aria-label="View Between Dusk and Dreams"><img src="assets/photos/archive-5-cac5299b0b.jpg" alt="Between Dusk and Dreams by Koketso Masemola" width="1392" height="2000" loading="lazy"><span class="archive-expand" aria-hidden="true">↗</span></button><figcaption><h3>Between Dusk and Dreams</h3><div class="archive-description"><p class="archive-credit">Koketso Masemola · 2023</p><p class="archive-medium"><strong>Medium:</strong> Acrylic on watercolour paper</p><p class="archive-prose">A dreamlike landscape featuring bare trees, distant mountains, reflections on water and a colourful sky. The blending of pink, red, orange and maroon creates an atmospheric scene illuminated by stars and a small full moon.</p></div></figcaption></figure>
<figure class="archive-card"><button type="button" class="archive-image archive-view" data-archive="6" aria-label="View Beneath the mask"><img src="assets/photos/archive-6-09c3f3c22a.jpg" alt="Beneath the mask by Koketso Masemola" width="1500" height="2000" loading="lazy"><span class="archive-expand" aria-hidden="true">↗</span></button><figcaption><h3>Beneath the mask</h3><div class="archive-description"><p class="archive-credit">Koketso Masemola · 2026</p><p class="archive-medium"><strong>Medium:</strong> Stippling using pen and markers on paper</p><p class="archive-prose">A faceless female figure with an Afro and expressive clothing, shown pulling a mask away from her face. The red and black composition explores appearance, identity and the relationship between how we present ourselves and what we conceal.</p></div></figcaption></figure></div></section>
